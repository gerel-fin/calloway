<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calloway Finance</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(140deg, #1B2A4E 0%, #22386A 60%, #1E4E6E 100%);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  .box { width: 100%; max-width: 360px; margin: 20px; padding: 28px 24px; border-radius: 18px;
         background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  p { margin: 0 0 18px; color: #C7D2E8; font-size: 14px; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 0; font-size: 16px; color: #0F172A; }
  button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
           background: #14B8C4; color: #0B1B33; font-size: 16px; font-weight: 700; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: #FCA5A5; }
  .wait { color: #C7D2E8; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>Calloway</h1>
  <p id="sub">Санхүүгийн самбар</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Нууц үг" autocomplete="current-password">
    <button id="go" type="submit">Нээх</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
/* Calloway – small door page. The dashboard itself lives in Gerel's Google Apps Script.
   This page only asks for the password (the dashboard key), loads the page from the script
   and passes its data requests through. Nothing secret is stored in this file. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbysEnZzsUqEYonVWBColK-Wy1K_pY6aIo7d7HCL4ltuTBR8e1Jqw1NocRZH56Q41D6fDw/exec';
  var WHICH = 'dash';                       // 'dash' = dashboard, 'scan' = contract scanner
  var STORE = 'calloway_' + WHICH + '_key';

  var $ = function (id) { return document.getElementById(id); };
  function save(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function load() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function forget() { try { localStorage.removeItem(STORE); } catch (e) {} }
  function say(t, wait) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (wait ? ' wait' : ''); }

  /* stands in for google.script.run: sends each call to the script */
  function bridge(key) {
    return '(function(){var API=' + JSON.stringify(API) + ',K=' + JSON.stringify(key) + ',W=' + JSON.stringify(WHICH) + ';' +
      'function call(fn,args){args=args.slice(1);var body=JSON.stringify(args);var req;' +
      'if(body.length>1500){req=fetch(API,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,k:K,w:W,a:args})});}' +
      'else{req=fetch(API+"?view=api&fn="+encodeURIComponent(fn)+"&k="+encodeURIComponent(K)+"&a="+encodeURIComponent(body),{credentials:"omit"});}' +
      'return req.then(function(r){return r.json();}).then(function(j){if(j.error)throw new Error(j.error);return j.ok;});}' +
      'function mk(ok,fail){return new Proxy({},{get:function(_,n){' +
      'if(n==="withSuccessHandler")return function(f){return mk(f,fail);};' +
      'if(n==="withFailureHandler")return function(f){return mk(ok,f);};' +
      'if(n==="withUserObject")return function(){return mk(ok,fail);};' +
      'return function(){call(n,[].slice.call(arguments)).then(function(v){if(ok)ok(v);},function(e){if(fail)fail(e);else console.error(e);});};}});}' +
      'window.google={script:{run:mk(null,null),host:{close:function(){}}}};})();';
  }

  function open(key) {
    $('go').disabled = true; say('Ачаалж байна…', true);
    fetch(API + '?view=api&fn=page&w=' + WHICH + '&k=' + encodeURIComponent(key), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.error) {
          $('go').disabled = false;
          if (j.denied) { forget(); $('pw').value = ''; }
          say(j.error); return;
        }
        save(key);
        var html = j.html.replace(/<head([^>]*)>/i, function (m) { return m + '<script>' + bridge(key) + '<\/script>'; });
        document.open(); document.write(html); document.close();
      })
      .catch(function () { $('go').disabled = false; say('Холболтын алдаа. Дахин оролдоно уу.'); });
  }

  $('f').onsubmit = function (e) { e.preventDefault(); var k = $('pw').value.trim(); if (k) open(k); };

  /* a link ending in #k=PASSWORD opens straight away, then the password is taken out of the address */
  var m = /[#&]k=([^&]+)/.exec(location.hash);
  if (m) { var hk = decodeURIComponent(m[1]); try { history.replaceState(null, '', location.pathname); } catch (e) {} open(hk); return; }
  var k0 = load();
  if (k0) open(k0); else $('pw').focus();
})();
</script>
</body>
</html>
